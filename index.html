<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Cadastro de Clientes</h1>
      <p>Cadastre, consulte e remova clientes usando a API CrudCrud.</p>
    </header>

    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Novo cliente</h2>
      <form id="client-form">
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" autocomplete="name" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <button type="submit" id="submit-button">Cadastrar cliente</button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Clientes cadastrados</h2>
      <p id="empty-message">Carregando clientes...</p>
      <ul id="client-list" aria-live="polite"></ul>
    </section>
  </main>
</body>
</html>
